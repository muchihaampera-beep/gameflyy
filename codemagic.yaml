workflows:
  android:
    name: Build GameFlyy APK
    instance_type: mac_mini
    environment:
      groups:
        - keystore_credentials
      vars:
        FCI_KEYSTORE_PATH: codemagic.keystore.jks
    scripts:
      - name: Build Android APK
        script: |
          cd app
          ./gradlew assembleRelease
    artifacts:
      - app/build/outputs/apk/release/*.apk
